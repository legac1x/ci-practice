name: CI practice

on: 
    push:
        branches:
            - main
        paths-ignore:
            - "**.md"

    pull_request:
        branches:
            - main
        paths-ignore:
            - "**.md"

jobs:
    python-app:
        runs-on: ubuntu-latest
        steps:
            - uses: action/checkout@v4
            - uses: action/setup-python@v6
              with: 
                python-version: '3.12'
                cache: 'pip'
            - run: pip install -r requirements.txt