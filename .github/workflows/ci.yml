name: Hello

on: [push, pull_request]

concurrency:
    group: demo-${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    greet:
        runs-on: ubuntu-latest

        timeout-minutes: 5

        steps:
            - uses: actions/checkout@v4
            - run: echo "Hello, GitHub Actions!"
