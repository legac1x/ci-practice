name: CI practice

on: 
    schedule:
        - cron: '*/5 * * * *'
    push:
        branches:
            - main
        paths-ignore:
            - "**.md"

    pull_request:
        branches:
            - main
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            environment:
                description: "Куда деплоить"
                type: choice
                options:
                    - dev 
                    - prod
                default: dev 


jobs:
    python-app:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with: 
                python-version: '3.12'
                cache: 'pip'
            - run: echo "event=${{ github.event_name }} ref=${{ github.ref }}"
            - run: pip install -r requirements.txt