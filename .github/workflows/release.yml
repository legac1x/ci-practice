name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Python 
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
                cache: 'pip'
            
            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip 
                python -m pip install -r requirements.txt 

            - name: Check style by ruff
              run: ruff check main.py test_main.py
            
            - name: Check unit tests
              run: python -m pytest -v

    release-check:
        needs: quality
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Set up docker buildx
            uses: docker/setup-buildx-action@v4

          - name: LogIn
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Build docker-container
            uses: docker/build-push-action@v7
            with: 
              context: .
              load: true 
              tags: ghcr.io/${{ github.repository_owner }}/ci-practice:${{ github.ref_name }}      

          - name: Run Trivy Scanner
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: 'ghcr.io/${{ github.repository_owner }}/ci-practice:${{ github.ref_name }}'
              severity: 'CRITICAL'
              scanners: 'vuln'
              exit-code: 1
          
          - name: Push docker image
            run: docker push ghcr.io/${{ github.repository_owner }}/ci-practice:${{ github.ref_name }} 

    deploy:
      needs: release-check 
      runs-on: ubuntu-latest
      environment: production
      permissions: {}
      concurrency:
        group: production-deploy
        cancel-in-progress: false 
      steps:
        - name: Configure SSH 
          env: 
            SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
            SSH_KNOWN_HOST: ${{ vars.DEPLOY_KNOWN_HOSTS }}
            SSH_HOST: ${{ vars.DEPLOY_HOST }}
            SSH_USER: ${{ vars.DEPLOY_USER }}
            GITHUB_TAG: ${{ github.ref_name }}
          run: |
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh
              
              printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
              chmod 600 ~/.ssh/deploy_key
              
              printf "%s\n" "$SSH_KNOWN_HOST" > ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts    
              if [[ ! "$GITHUB_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "Invalid release tag"
                  exit 1
              fi              
              ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "$SSH_USER"@"$SSH_HOST" \
              "sudo -n /usr/local/sbin/deploy-ci-practice '$GITHUB_TAG'"