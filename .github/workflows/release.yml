name: Release

on:
    push:
        tags:
            - "v*"


jobs:
    release-check:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v4

          - name: Set up docker buildx
            uses: docker/setup-buildx-action@v4

          - name: LogIn
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
          - name: Build docker-container
            uses: docker/build-push-action@v7
            with:
              context: .
              push: true 
              tags: ghcr.io/${{ github.repository_owner }}/ci-practice:${{ github.ref_name }}
          
    deploy:
      needs: release-check 
      runs-on: ubuntu-latest
      environment: production
      permissions: {}
      concurrency:
        group: production-deploy
        cancel-in-progress: false 
      steps:
        - name: Configure SSH 
          env: 
            SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
            SSH_KNOWN_HOST: ${{ vars.DEPLOY_KNOWN_HOSTS }}
            SSH_HOST: ${{ vars.DEPLOY_HOST }}
            SSH_USER: ${{ vars.DEPLOY_USER }}
            GITHUB_TAG: ${{ github.ref_name }}
          run: |
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh
              
              printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
              chmod 600 ~/.ssh/deploy_key
              
              printf "%s\n" "$SSH_KNOWN_HOST" > ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts    
              if [[ ! "$GITHUB_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "Invalid release tag"
                  exit 1
              fi              
              ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "$SSH_USER"@"$SSH_HOST" \
              "sudo -n /usr/local/sbin/deploy-ci-practice '$GITHUB_TAG'"
              
